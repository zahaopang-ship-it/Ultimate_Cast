name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q ScreenCast.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - name: Publish debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp proj/app/build/outputs/apk/debug/app-debug.apk ScreenCast.apk
          gh release create "v${{ github.run_number }}" ScreenCast.apk --title "ScreenCast debug build ${{ github.run_number }}" --notes "Unsigned debug APK for testing. This is not a signed production release."
